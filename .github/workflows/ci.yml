# .github/workflows/ci.yml
name: CI — Lint, Smoke Tests & App Startup

on:
  push:
    branches: [main,feature/add-github-ci]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Smoke + App Startup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install CI deps (lightweight subset — no torch/prophet in CI) ─────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps from requirements.txt
          pip install \
            joblib==1.4.2 \
            langdetect==1.0.9 \
            xgboost==2.1.4 \
            "scikit-learn==1.6.1" \
            "plotly==6.0.1" \
            "requests==2.32.3" \
            "pillow==11.2.1" \
            "numpy==1.26.4" \
            "scipy==1.13.1"
          # Streamlit (pinned to a stable release)
          pip install "streamlit==1.35.0"
          # Test & lint tools
          pip install pytest flake8

      # ── 4. Lint ───────────────────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          # Fail on real errors (E9xx = syntax/runtime, F63x = invalid escapes,
          # F7xx = undefined names, F82x = undefined names in annotations)
          flake8 app/app.py tests/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Warn (don't fail) on style issues — max line length 120
          flake8 app/app.py tests/ \
            --count \
            --exit-zero \
            --max-line-length=120 \
            --statistics

      # ── 5. Smoke tests ────────────────────────────────────────────────────────
      - name: Run smoke tests
        run: |
          pytest tests/test_smoke.py tests/test_app_startup.py \
            -v \
            --tb=short \
            --no-header \
            -q
      # ── 6. Notebook smoke tests ───────────────────────────────────────────────
      - name: Test key notebooks (nbmake)
        run: |
          pip install nbmake
          pytest --nbmake notebooks/03.data_preprocessing.ipynb \
                          notebooks/05.modelling.ipynb \
            --nbmake-timeout=120      

      # ── 7. Summary ────────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: echo "CI complete. Check the test output above for details."